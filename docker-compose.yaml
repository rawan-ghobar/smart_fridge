version: '3.8'

services:
  server:
    image: rawanghobar/smart_fridge_laravel:latest
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: fridget
      DB_USERNAME: root
      DB_PASSWORD: 1234
    depends_on:
      - database

  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: fridget
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: