name: Build, Test & Deploy Laravel to EC2

on:
  push:
    branches:
      - develop
      - main

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, dom, curl,fileinfo
          coverage: none

      - name: Install Composer dependencies
        working-directory: smart-fridge-server
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Prepare Laravel environment
        working-directory: smart-fridge-server
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=testing_db/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          php artisan migrate --force

      - name: Run Laravel Tests
        working-directory: smart-fridge-server
        run: php artisan test --debug

  build-and-push:
    needs: laravel-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Build Laravel Docker image
        working-directory: smart-fridge-server
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/smart_fridge_laravel:latest .

      - name: Push image to DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/smart_fridge_laravel:latest

  deploy-to-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/smart_fridge
            echo "Stopping current containers..."
            sudo docker compose down
            echo "Cleaning unused resources..."
            sudo docker system prune -f
            echo "Pulling latest image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/smart_fridge_laravel:latest
            echo "Starting containers..."
            sudo docker compose up -d

            for i in {1..12}; do
              echo "Waiting for MySQL to be ready..."
              sudo docker exec smart_fridge-database-1 mysqladmin ping -h localhost -p1234 && break
              sleep 5
            done

            for i in {1..5}; do
              echo "Trying Laravel migrations..."
              sudo docker exec smart_fridge-server-1 php artisan migrate --force && break
              echo "Migration failed, retrying in 5s..."
              sleep 5
            done

  deploy-to-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate main is merged from develop
        run: |
          git fetch origin develop
          git merge-base --is-ancestor origin/develop HEAD || {
            echo "ERROR: main is not up to date with develop"
            exit 1
          }

      - name: Deploy to PRODUCTION EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_PRODUCTION }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            if [ ! -d "/home/${{ secrets.EC2_USER }}/smart_fridge" ]; then
              echo "Cloning project into /home/${{ secrets.EC2_USER }}/smart_fridge"
              git clone https://github.com/rawan-ghobar/smart_fridge.git /home/${{ secrets.EC2_USER }}/smart_fridge
            else
              echo "Project already exists. Pulling latest code..."
              cd /home/${{ secrets.EC2_USER }}/smart_fridge
              git pull origin main
            fi

            cd /home/${{ secrets.EC2_USER }}/smart_fridge

            echo "Stopping current containers..."
            sudo docker compose down

            echo "Cleaning up unused Docker resources..."
            sudo docker system prune -f

            echo "Pulling latest Docker image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/smart_fridge_laravel:latest

            echo "Starting containers..."
            sudo docker compose up -d

            echo "Waiting for MySQL to be ready..."
            for i in {1..12}; do
              sudo docker exec smart_fridge-database-1 mysqladmin ping -h localhost -p1234 && break
              sleep 5
            done

            echo "Running Laravel migrations..."
            for i in {1..5}; do
              sudo docker exec smart_fridge-server-1 php artisan migrate --force && break
              echo "Migration failed, retrying in 5s..."
              sleep 5
            done